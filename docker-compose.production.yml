name: agbn-website

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agbn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agbn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agbn -d agbn']
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:3100:3000'
    volumes:
      # Payload writes uploaded media here. Keep it outside the image so a web
      # rebuild never discards CMS assets.
      - ./public/media:/app/public/media
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://agbn:${POSTGRES_PASSWORD}@postgres:5432/agbn
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
      NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    # This explicit name keeps the database stable if the Compose project name changes.
    name: agbn-website_postgres_data
    external: true
